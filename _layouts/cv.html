---
layout: page
---

{{ content }}

{% include cv-style.html %}

{% assign cv_sections = site.cv | sort: 'order' %}

<ul class="cv-nav">
  {% for s in cv_sections %}
    <li><a href="#{{ s.slug }}">{{ s.nav }}</a></li>
  {% endfor %}
</ul>

{% for s in cv_sections %}
<section class="cv-section" id="{{ s.slug }}">
  <h2 class="cv-heading">{{ s.title }}</h2>
  {{ s.content }}
</section>
{% endfor %}

{% include cv-script.html %}
